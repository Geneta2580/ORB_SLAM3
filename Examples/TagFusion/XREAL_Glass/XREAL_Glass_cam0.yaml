%YAML:1.0

#--------------------------------------------------------------------------------------------
# XREAL Glass cam0 (room-patrol) — TagFusion monocular
# Dataset example:
#   /home/geneta/dataset/20260227-room-patrol-11-1/raw_data/glass/cam0/images
#   images: m0000000.pgm ... + timestamps.txt
# Resolution (W x H): 480 x 640
#
# NOTE: glass_config / ground_truth/calib 为 fisheye624（kc 12 维）。
#       ORB-SLAM3 此处使用 KannalaBrandt8（k1..k4），请自行填写等效内参与畸变。
#--------------------------------------------------------------------------------------------

File.version: "1.0"

#--------------------------------------------------------------------------------------------
# Camera Parameters  <<< 请填写鱼眼内参 / 畸变 >>>
#--------------------------------------------------------------------------------------------
Camera.type: "KannalaBrandt8"

# TODO: 填写 Camera1 内参（像素）
Camera1.fx: 240.7419863233
Camera1.fy: 240.7144386986
Camera1.cx: 242.1941637626
Camera1.cy: 319.6862062347

# TODO: 填写 KannalaBrandt8 畸变 k1..k4（勿直接照搬 fisheye624 的 12 维 kc）
Camera1.k1: -0.00125597
Camera1.k2:  0.08114141
Camera1.k3: -0.08559616
Camera1.k4:  0.02660804

Camera.width: 480
Camera.height: 640

# 约 30 Hz（timestamps.txt 相邻帧间隔 ~0.033s）；Settings 要求整数
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. Ignored if grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0

#--------------------------------------------------------------------------------------------
# Tag Parameters  (backend: Thirdparty/apriltag ethz_apriltag2)
#--------------------------------------------------------------------------------------------
Tag.family: "tag36h11"          # tag36h11/tag36h9/tag25h9/tag25h7/tag16h5
Tag.hamming: 2                  # 接受的最大 hammingDistance（召回可试 2；正式可收紧到 1）
Tag.black_border: 2             # ethz TagDetector blackBorder；标准印刷 tag36h11 一般为 1
Tag.size: 0.16                  # Tag 边长（米），IPPE 用
Tag.clahe: 0                    # 检测前 CLAHE（小/暗 tag 可开；噪声大可关）
Tag.clahe_clip_limit: 2.0
Tag.clahe_tile_grid: 8
Tag.verbose: 1
Tag.export: 1
Tag.export_dir: "tag_export"
Tag.viewer: 1
